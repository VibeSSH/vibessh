[package]
name = "vibessh"
version.workspace = true
description = "VibeSSH - hybrid SSH/SFTP + Vibe Agent server manager"
authors = ["you"]
edition.workspace = true
license.workspace = true

[lib]
name = "vibessh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
vibessh-protocol = { path = "../protocol" }
# WebSocket client for AgentTransport. Runs on Tauri's own tokio runtime
# (`tauri::async_runtime::spawn`) rather than starting a second one.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[dev-dependencies]
# Only needed by tests/agent_client.rs's mock server; the real client code
# doesn't bind sockets itself.
tokio = { version = "1", features = ["net"] }
