[package]
name = "vibessh"
version.workspace = true
description = "VibeSSH - hybrid SSH/SFTP + Vibe Agent server manager"
authors = ["you"]
edition.workspace = true
license.workspace = true

[lib]
name = "vibessh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
vibessh-protocol = { path = "../protocol" }
# WebSocket client for AgentTransport. Runs on Tauri's own tokio runtime
# (`tauri::async_runtime::spawn`) rather than starting a second one.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
# Agent connections are wss:// with a self-signed cert (Etap K - no CA for
# an arbitrary self-hosted VPS agent) - see agent_client/mod.rs for what
# accepting that cert does and doesn't protect against.
native-tls = "0.2"
# OS credential store (Windows Credential Manager / macOS Keychain / Linux
# Secret Service) for agent device credentials - see storage/credentials.rs.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
# Server records (Etap 2) - "bundled" statically links SQLite so users don't
# need a system libsqlite3 install.
rusqlite = { version = "0.32", features = ["bundled"] }
# SSH transport (Etap 3) - pure Rust, async/tokio-native. "ring" instead of
# the default aws-lc-rs backend: aws-lc-rs needs cmake to build its C/asm
# core, which isn't guaranteed to be installed; ring builds with just the
# MSVC toolchain already required for this project (same backend rustls
# already uses here, see agent/Cargo.toml).
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }

[dev-dependencies]
# Only needed by tests/agent_client.rs's mock server; the real client code
# doesn't bind sockets itself.
tokio = { version = "1", features = ["net"] }
# tests/ssh_client.rs's mock SSH server needs a host key - russh's own
# `PrivateKey::random` wants a rand 0.10-shaped RNG, unrelated to (and
# coexisting fine alongside) the workspace's rand 0.8 used elsewhere.
rand = "0.10"
