[package]
name = "vibessh"
version.workspace = true
description = "VibeSSH - hybrid SSH/SFTP + Vibe Agent server manager"
authors = ["you"]
edition.workspace = true
license.workspace = true

[lib]
name = "vibessh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
# Native open/save file dialogs for Files module upload/download.
tauri-plugin-dialog = "2"
# Opens a phpMyAdmin URL in the user's system browser (Databases tab) -
# only the `open` command is granted (capabilities/default.json), not the
# plugin's own `execute` (arbitrary process spawn), which this app has no
# use for.
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
vibessh-protocol = { path = "../protocol" }
# Generated database names/usernames/passwords for Application Databases
# (services::database_service) - same workspace version `protocol`'s own
# generate_pairing_code already uses, not a new choice.
rand = { workspace = true }
# Archive extraction for Application Files (zip only for the first pass -
# by far the most common case for a plugin/world/backup upload). `enclosed_name()`
# is the crate's own Zip Slip guard, used as the first of two path-escape
# checks in files::archive - the second is the same sandbox/canonicalize
# jail every other file operation already goes through.
zip = "2"
# WebSocket client for AgentTransport. Runs on Tauri's own tokio runtime
# (`tauri::async_runtime::spawn`) rather than starting a second one.
# "process" (LocalProcessRuntime, Applications Phase 2) is new here -
# everything else was already enabled for the agent transport/SSH/terminal.
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "fs", "io-util", "net", "process"] }
# Cross-platform CPU/RAM-per-PID sampling for LocalProcessRuntime's
# resource_usage() - same crate and version the `agent` crate already uses
# for the identical purpose (see agent/src/metrics.rs), not a new pattern.
sysinfo = "0.39"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
# Agent connections are wss:// with a self-signed cert (Etap K - no CA for
# an arbitrary self-hosted VPS agent) - see agent_client/mod.rs for what
# accepting that cert does and doesn't protect against.
native-tls = "0.2"
# OS credential store (Windows Credential Manager / macOS Keychain / Linux
# Secret Service) for agent device credentials - see storage/credentials.rs.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
# Server records (Etap 2) - "bundled" statically links SQLite so users don't
# need a system libsqlite3 install.
rusqlite = { version = "0.32", features = ["bundled"] }
# Versioned schema migrations (user_version-based) for the local SQLite store
# - replaces the old CREATE TABLE IF NOT EXISTS approach, which had no
# migration history and couldn't express an actual schema change.
rusqlite_migration = "1"
# SSH transport (Etap 3) - pure Rust, async/tokio-native. "ring" instead of
# the default aws-lc-rs backend: aws-lc-rs needs cmake to build its C/asm
# core, which isn't guaranteed to be installed; ring builds with just the
# MSVC toolchain already required for this project (same backend rustls
# already uses here, see agent/Cargo.toml).
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
# SFTP (Files module) - runs over a subsystem channel on the same russh
# connection, not a separate transport.
russh-sftp = "2"
# HTTP client for the new cloud backend (accounts/teams/roles) - default-tls
# (native-tls) rather than adding rustls as a second TLS stack, since
# native-tls is already a dependency here for agent_client's WSS connections.
# Also what the S3-compatible backup destination client (src/s3) uploads
# through - same client, no second HTTP stack for that either.
# "stream" is new here, for the Vibe AI assistant: an OpenAI-compatible
# endpoint returns a streamed answer as server-sent events, and
# `bytes_stream()` is what lets `ai::openai_compatible` forward tokens
# to the UI as they arrive instead of holding the whole answer back.
reqwest = { version = "0.12", features = ["json", "stream"] }
# AWS SigV4 request signing for the S3-compatible backup destination
# (src/s3) - hand-rolled against these two primitives rather than pulling in
# aws-sdk-s3 (a very large dependency tree, and its own opinions about
# credential resolution this app doesn't need - VibeSSH already has exactly
# one, explicitly-configured destination). Every S3-compatible provider
# (AWS S3, Cloudflare R2, MinIO, ...) speaks the same SigV4-signed REST API.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Windows-only piece of LocalProcessRuntime's graceful stop (Applications
# Phase 2). On Unix, sysinfo's own Process::kill_with(Signal::Term) already
# sends a real SIGTERM, so no extra dependency is needed there. Windows has
# no SIGTERM equivalent - sysinfo's kill_with() on Windows just shells out to
# `taskkill /F` for any signal, which is a force-kill, not a graceful one -
# so GenerateConsoleCtrlEvent(CTRL_BREAK_EVENT) is the closest real "please
# shut down" signal a child console process can receive. It only works if
# the child was spawned with CREATE_NEW_PROCESS_GROUP (see
# runtime::local_process) so the event targets the child's own process group
# instead of also hitting VibeSSH.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
# Only needed by tests/agent_client.rs's mock server; the real client code
# doesn't bind sockets itself.
tokio = { version = "1", features = ["net"] }
# tests/ssh_client.rs's mock SSH server needs a host key - russh's own
# `PrivateKey::random` wants a rand 0.10-shaped RNG. Renamed via `package =`
# (rather than plain `rand = "0.10"`) because the workspace's rand 0.8 is
# now also a real `[dependencies]` entry above (services::database_service's
# generated names/passwords) - two same-named `rand` crates at different
# versions in one test build is a hard "multiple candidates" compile error,
# not just a style choice.
rand010 = { package = "rand", version = "0.10" }
# Property tests (FIX_PLAN C.7). The functions worth this treatment are the
# pure parsers and sanitizers on the boundary between remote output (or user
# input) and everything that trusts it - the places where an example-based
# test only ever proves the examples someone thought of.
proptest = { version = "1", default-features = false, features = ["std"] }
