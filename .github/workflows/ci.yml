# The repository had no CI at all until this file. Every check here is one
# that was already meant to hold and had silently stopped holding: the
# workspace test suite did not compile, 77 backend tests failed on any
# machine without Postgres, and the dependency audit reported a high-severity
# advisory - none of which anything would have caught before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run for the same ref - CI feedback on
  # a commit that has already been replaced is just queue time.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug symbols in CI, and this is not a shortcut.
  #
  # The Test step had never actually run before: every previous run failed at
  # Clippy first, and the moment it stopped doing so, linking the integration
  # test binary killed the linker outright - `collect2: fatal error: ld
  # terminated with signal 7 [Bus error]`, twice on the same target. A bus
  # error from lld is what a runner out of room looks like: the output file
  # is written through a mapping, and a mapping that cannot be backed raises
  # a signal rather than returning an error. This dependency graph - webkit,
  # aws-lc, ring, sqlite, the whole SSH stack - carries DWARF for every crate
  # into every one of several test binaries.
  #
  # Dropping the symbols costs line numbers in a panic backtrace and nothing
  # else: an assertion still names what it expected and what it got, which is
  # what a CI failure is read from. The alternative - deleting preinstalled
  # tooling from the runner to make space - trades a permanent fix for a
  # scavenger hunt that breaks whenever the image changes.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-22.04

    # A real Postgres, because the tests that need one have never run.
    #
    # `apps/backend/tests/` holds roughly sixty integration tests over the
    # real endpoints - authorisation, privilege escalation, the AI
    # allowance, revocations. Every one is `#[ignore]`, because a plain
    # checkout has no database and cargo stops at the first failing test
    # binary. That marker was the right call and it had a cost nobody was
    # paying attention to: the tests compiled, so they looked maintained,
    # and not one of them had ever been executed by anything.
    #
    # Pinned to the same major version the deployment runs. A test suite that
    # proves a query works on 16 while production is on 17 is testing the
    # wrong database, and this one leans on things that are version-specific
    # - `gen_random_uuid()` in core, partial unique indexes, `RETURNING` on a
    # conditional UPDATE.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibessh_test
        ports:
          - 5432:5432
        # The job's first query would otherwise race the container's own
        # start-up, which fails as a connection error and reads like a bug in
        # the code rather than a service that was not up yet.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Tauri's own Linux build dependencies. Needed even for `cargo test`,
      # because the `vibessh` crate links against webkit2gtk.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          # A Secret Service implementation. Twelve tests deliberately use the
          # *real* OS keyring rather than a fake - that is the point of them,
          # since the property they check is that a secret reaches the
          # platform store and never SQLite. A headless runner has no
          # `org.freedesktop.secrets`, so without this they fail with a DBus
          # error and the obvious "fix" is to stop running them, which would
          # leave the one automated check of that property switched off.
          sudo apt-get install -y gnome-keyring dbus-x11

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # What the cached binaries were built against, as part of the cache key.
      #
      # This is the failure it exists to prevent, because it already
      # happened. The three Linux jobs used to run on a self-hosted machine
      # (Ubuntu 24.04, glibc 2.39) and saved `target/` and `~/.cargo/bin`
      # into the Actions cache from there. When they moved back to GitHub's
      # `ubuntu-22.04` (glibc 2.35) the same cache was restored, and every
      # build script and every cached binary died on the dynamic linker
      # before compiling a line of this repository:
      #
      #     libc.so.6: version `GLIBC_2.39' not found
      #
      # `Swatinem/rust-cache` keys on `runner.os`, the compiler version and
      # the job - all of which matched, because "Linux" is the same string on
      # both machines. What actually has to match is the C library the
      # binaries were linked against, so that is what goes in the key,
      # alongside the distribution release. A cache from an incompatible
      # machine is then never restored rather than restored and fatal.
      - name: Identify the runner's C library
        id: libc
        run: echo "id=$(. /etc/os-release && echo "$ID$VERSION_ID")-glibc$(ldd --version | head -1 | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.libc.outputs.id }}

      # Warnings are denied rather than merely reported. The audit found 72
      # standing warnings, including a `MutexGuard` held across four await
      # points; a warning nobody is required to look at is not a signal.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `--workspace` specifically: the break that hid for months was in an
      # integration test target, which a bare `cargo test` in one crate would
      # not have compiled.
      #
      # Wrapped in a session with an unlocked keyring, for the tests described
      # at the install step above. `--components=secrets` is the only part of
      # gnome-keyring needed here; the password is arbitrary, since the
      # keyring lives and dies with this one process.
      # Printed before the step that ran out of it, so the next failure of this
      # kind is read rather than guessed at - which is what this one cost.
      - name: Disk space
        run: df -h /

      - name: Test
        run: |
          dbus-run-session -- sh -c '
            echo "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --workspace
          '

      # The `#[ignore]` half, which is where the backend's real coverage is.
      # Run separately rather than by dropping the marker: the marker is what
      # keeps `cargo test` working in a checkout with no database, which is
      # every developer machine.
      #
      # `--test-threads=1` is required by `tests/ai_quota.rs`, which reads
      # process environment at request time to vary the daily limit -
      # environment is per process, not per thread, so two of those tests in
      # flight together read each other's settings. Serial across all of them
      # is a few seconds on tests this small, and the alternative is a flake
      # that only ever appears here.
      #
      # `DATABASE_URL` is set on this step alone. Job-wide it would also be
      # visible to the run above, where nothing should be able to reach a
      # database at all.
      - name: Backend integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vibessh_test
        run: cargo test -p vibessh-backend -- --ignored --test-threads=1

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `--frozen-lockfile` is the point of committing bun.lock: a build that
      # quietly resolved a different version than the one that was reviewed
      # is not the build anybody approved.
      - run: bun install --frozen-lockfile

      # tsconfig already has `strict`, `noUnusedLocals` and
      # `noUnusedParameters` on and the codebase already passes - this is
      # what keeps it that way.
      - name: Typecheck
        run: bun run typecheck

      # ~18k lines of TypeScript had no tests at all before this workflow -
      # see FIX_PLAN Phase C.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `--frozen-lockfile` is the point of committing bun.lock: a build that
      # quietly resolved a different version than the one that was reviewed
      # is not the build anybody approved.
      - run: bun install --frozen-lockfile

      # `--audit-level=moderate`, which is where this should have been all
      # along. It was loosened to `critical` when this file was written,
      # because of a standing `high` against vite that needed a major upgrade
      # to clear (F-004), and a gate nobody can make green gets disabled
      # rather than fixed.
      #
      # That upgrade has landed - vite 8 and react-router 7 - and the audit
      # now reports zero advisories at every level. So this goes to the
      # strictest setting the tree can actually hold, rather than back to the
      # `high` the old comment promised: there is no reason to leave room for
      # a moderate when there are none.
      - name: Dependency audit
        run: bun audit --audit-level=moderate

      - uses: dtolnay/rust-toolchain@stable

      # Same reason as the Rust job - see the long note there. This job felt
      # it through `cargo-audit` itself, which is cached as a binary and so
      # could not start at all.
      - name: Identify the runner's C library
        id: libc
        run: echo "id=$(. /etc/os-release && echo "$ID$VERSION_ID")-glibc$(ldd --version | head -1 | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.libc.outputs.id }}

      # `cargo install` is a no-op when the binary is already in the restored
      # cache, so the version check is what proves the restored one actually
      # runs here rather than failing later inside the audit, where a linker
      # error reads like a security finding.
      - name: Install cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --version

      # One advisory is ignored, and this is the whole justification for it.
      #
      # RUSTSEC-2023-0071 (Marvin Attack, 5.9 medium) is against the `rsa`
      # crate, which cargo-audit itself reports as "No fixed upgrade is
      # available!" - the constant-time fix has never shipped. It arrives
      # here transitively down two independent paths this repository does not
      # control: `russh` -> rsa 0.10.0-rc, and `sqlx-mysql` -> rsa 0.9. There
      # is nothing to upgrade to and nothing to pin.
      #
      # The alternatives were leaving this job red forever - which is how a
      # gate gets deleted rather than fixed, the same reasoning the dependency audit
      # level above records - or dropping MySQL support and SSH RSA keys,
      # which is not proportionate to a medium-severity timing sidechannel
      # against a code path neither library uses for private-key decryption.
      # See docs/security/threat-model.md for the exposure and for what would remove
      # this line.
      #
      # It is a deliberately narrow ignore: one advisory id, not a severity
      # threshold. Anything else, at any severity, still fails this job.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071
