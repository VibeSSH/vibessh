# Builds signed installers and publishes them where the app can find them.
#
# **Why the artifacts go to a second repository.** This one is private, and
# GitHub serves release assets from a private repository only with an
# Authorization header. An updater that needed one would mean shipping a token
# inside the app - which is a token for the private source, handed to everyone
# who installs it. `VibeSSH/vibessh-releases` is public and holds nothing but
# installers and their manifest.
#
# **The signature is the part that matters.** `latest.json` carries a minisign
# signature over each installer, checked against a public key compiled into
# the app. Without it an update mechanism is remote code execution with extra
# steps: anything able to answer the update URL could hand over an installer
# of its own and the app would run it. The private half lives only in this
# repository's secrets and never in the tree.
#
# **Why building and publishing are separate jobs.** Two platforms produce two
# installers and `latest.json` names both, so it cannot be written by either
# build. Splitting them also means a publishing failure costs a retry of the
# last job rather than of both builds - which is exactly what an empty
# releases repository cost when the two were one.
name: Release

on:
  push:
    tags: ["v*"]
  # Buildable by hand for a dry run that publishes nothing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the installers but publish nothing
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the other one works.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            platform: windows-x86_64
            bundles: nsis
          # Not `ubuntu-latest`: an AppImage runs on the glibc it was built
          # against and newer, so the oldest supported runner is what decides
          # how old a distribution can be and still run this.
          - os: ubuntu-22.04
            label: Linux installer
            platform: linux-x86_64
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Otherwise the two platforms share one cache and evict each other.
          key: ${{ matrix.platform }}

      # What Tauri 2 links against on Linux. Absent from the runner image, and
      # without them the build fails as a linker error a long way from its
      # cause.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev build-essential file

      - name: Install dependencies
        run: npm ci

      # The version an installer carries comes from tauri.conf.json, not from
      # the tag. Checking they agree here turns a silent mismatch - an update
      # the app can never see as newer - into a failed build.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$conf" != "$tag" ]; then
            echo "::error::tauri.conf.json says $conf, the tag says $tag"
            exit 1
          fi
          echo "version $conf"

      - name: Build and sign
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No release is created here - this repository is private, so a
          # release in it would be unreachable by the updater. The bundler
          # still signs what it builds and leaves the signature beside the
          # installer, which is all the next step needs.
          args: --verbose --bundles ${{ matrix.bundles }}

      # The installer paths come from the action's own output rather than from
      # a guess: an earlier attempt looked under `src-tauri/target`, which does
      # not exist here, because this is a Cargo workspace and the target
      # directory sits at the repository root.
      - name: Collect what was built
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          mkdir -p release-artifacts
          node .github/workflows/collect_artifacts.cjs
          ls -l release-artifacts
          # An unsigned installer must stop the build. Publishing one would
          # leave the app unable to tell a real update from anything else that
          # manages to answer the update URL.
          #
          # Two things silence the signing, and the first is easy to mistake
          # for the second: `createUpdaterArtifacts` in tauri.conf.json is off
          # by default, and with it off the bundler never signs anything, so a
          # perfectly good key looks like a broken one.
          if ! ls release-artifacts/*.sig >/dev/null 2>&1; then
            echo "::error::nothing in release-artifacts is signed - check bundle.createUpdaterArtifacts in tauri.conf.json, then TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: release-artifacts/*
          retention-days: 30
          if-no-files-found: error

  agent:
    name: Linux agent
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Only for `tauri signer` below - the agent itself is plain Cargo.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          key: agent

      # Cross-compiling for arm64 without an arm runner - which a private
      # repository does not get for free.
      #
      # `libc6-dev-arm64-cross` is not optional, though the first version of
      # this assumed it was: the agent's own dependencies are pure Rust, but
      # `ring` arrives underneath them through rustls and rcgen, and it builds
      # C. Without the target's libc headers the cross compiler reaches for
      # the host's and fails on a missing `bits/libc-header-start.h`.
      - name: Install the arm64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release -p vibe-agent --target x86_64-unknown-linux-gnu
          cargo build --release -p vibe-agent --target aarch64-unknown-linux-gnu

      # The names and the checksum format are what `agent-install/install.sh`
      # asks for: `vibe-agent-linux-<arch>` beside a `.sha256` in sha256sum's
      # own "<digest>  <filename>" layout.
      - name: Install the signing tool
        run: npm ci

      - name: Name them what the installer looks for
        run: |
          mkdir -p release-artifacts
          cp target/x86_64-unknown-linux-gnu/release/vibe-agent release-artifacts/vibe-agent-linux-amd64
          cp target/aarch64-unknown-linux-gnu/release/vibe-agent release-artifacts/vibe-agent-linux-arm64
          # Published alongside the binaries so the one-line install command
          # can point at a public URL. It used to point into this repository,
          # which is private, so every user got a 404 from the very first
          # step.
          cp agent-install/install.sh release-artifacts/install.sh
          cd release-artifacts
          for file in vibe-agent-linux-amd64 vibe-agent-linux-arm64; do
            sha256sum "$file" > "$file.sha256"
          done
          ls -l

      # The same key the desktop updater checks. A checksum only says the
      # download arrived intact - anyone able to serve the binary can serve a
      # matching checksum - and this installs a root-owned systemd service, so
      # "who published it" is the question worth answering.
      - name: Sign the binaries
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in release-artifacts/vibe-agent-linux-amd64 release-artifacts/vibe-agent-linux-arm64; do
            npx tauri signer sign "$file"
            # Never published unsigned: the installer refuses an unsigned
            # binary, so shipping one would only produce a confusing failure
            # on the user's machine instead of here.
            if [ ! -s "$file.sig" ]; then
              echo "::error::$file was not signed"
              exit 1
            fi
          done
          ls -l release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux
          path: release-artifacts/*
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Write the update manifest
        shell: bash
        run: |
          mkdir -p dist-release
          find incoming -type f -exec cp {} dist-release/ \;
          ls -l dist-release
          python3 .github/workflows/write_manifest.py

      - name: Publish to the public releases repository
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          # A token with write access to VibeSSH/vibessh-releases only. The
          # workflow's own GITHUB_TOKEN cannot reach another repository.
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          # Deliberately not --prerelease, beta tags included. The app asks
          # GitHub for releases/latest/download/latest.json, and GitHub does
          # not count a pre-release as the latest one - so the flag would leave
          # every installed copy getting a 404 on every check. The version in
          # the tag is what says this is a beta.
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --repo VibeSSH/vibessh-releases \
            --title "VibeSSH $GITHUB_REF_NAME" \
            --notes "Installers and update manifest for $GITHUB_REF_NAME. Source: private repository."
