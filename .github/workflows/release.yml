# Builds a signed Windows installer and publishes it where the app can find
# it.
#
# **Why the artifacts go to a second repository.** This one is private, and
# GitHub serves release assets from a private repository only with an
# Authorization header. An updater that needed one would mean shipping a token
# inside the app - which is a token for the private source, handed to everyone
# who installs it. `VibeSSH/vibessh-releases` is public and holds nothing but
# installers and their manifest.
#
# **The signature is the part that matters.** `latest.json` carries a minisign
# signature over the installer, checked against a public key compiled into the
# app. Without it an update mechanism is remote code execution with extra
# steps: anything able to answer the update URL could hand over an installer
# of its own and the app would run it. The private half lives only in this
# repository's secrets and never in the tree.
name: Release

on:
  push:
    tags: ["v*"]
  # Buildable by hand for a dry run that publishes nothing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the installer but publish nothing
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The version the installer carries comes from tauri.conf.json, not from
      # the tag. Checking they agree here turns a silent mismatch - an update
      # the app can never see as newer - into a failed build.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($conf -ne $tag) {
            Write-Error "tauri.conf.json says $conf, the tag says $tag"
            exit 1
          }
          Write-Host "version $conf"

      - name: Build and sign
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No release is created here - this repository is private, so a
          # release in it would be unreachable by the updater. The bundler
          # still signs what it builds and leaves the signature beside the
          # installer, which is all the next step needs.
          args: --verbose

      # The manifest is written here rather than taken from the build.
      # `tauri-action` only ever synthesises `latest.json` while uploading to a
      # release, so a run that publishes nothing produces none - and even on a
      # real release the URL it would write points at this repository, which is
      # private and therefore useless to the updater. The one thing that cannot
      # be reconstructed is the signature, and the bundler does leave that on
      # disk.
      #
      # The installer paths come from the action's own output rather than from
      # a guess: an earlier attempt looked under `src-tauri/target`, which does
      # not exist here, because this is a Cargo workspace and the target
      # directory sits at the repository root.
      - name: Write the update manifest
        id: artifacts
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null

          # The tag is derived from the version rather than from the ref, so a
          # dry run on a branch still writes the URL a release would have.
          # They cannot disagree on a real release: an earlier step refuses to
          # build when the tag and tauri.conf.json do not match.
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"

          $paths = $env:ARTIFACT_PATHS | ConvertFrom-Json
          foreach ($p in $paths) {
            if (Test-Path $p) { Copy-Item $p dist-release/ -Force }
            if (Test-Path "$p.sig") { Copy-Item "$p.sig" dist-release/ -Force }
          }

          $installer = Get-ChildItem dist-release -Filter *-setup.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error "no NSIS installer among: $($paths -join ', ')"
            exit 1
          }

          # An unsigned installer must stop the build. Publishing one would
          # leave the app unable to tell a real update from anything else that
          # manages to answer the update URL.
          #
          # Two things silence the signing, and the first is easy to mistake
          # for the second: `createUpdaterArtifacts` in tauri.conf.json is off
          # by default, and with it off the bundler never signs anything, so a
          # perfectly good key looks like a broken one.
          $sig = "$($installer.FullName).sig"
          if (-not (Test-Path $sig)) {
            Write-Error "no signature beside the installer - check bundle.createUpdaterArtifacts in tauri.conf.json, then TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          }

          $manifest = [ordered]@{
            version   = $version
            notes     = "VibeSSH $tag"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              # The updater sniffs the bytes it downloads, so it accepts the
              # NSIS installer directly - no wrapping archive needed.
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig -Raw).Trim()
                url       = "https://github.com/VibeSSH/vibessh-releases/releases/download/$tag/$($installer.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content dist-release/latest.json -Encoding utf8

          Get-ChildItem dist-release | ForEach-Object { Write-Host ("{0}  {1:N0} B" -f $_.Name, $_.Length) }
          Write-Host "--- latest.json ---"
          Get-Content dist-release/latest.json

      - name: Publish to the public releases repository
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        shell: pwsh
        env:
          # A token with write access to VibeSSH/vibessh-releases only. The
          # workflow's own GITHUB_TOKEN cannot reach another repository.
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"

          # Deliberately not --prerelease, beta tags included. The app asks
          # GitHub for `releases/latest/download/latest.json`, and GitHub does
          # not count a pre-release as the latest one - so the flag would leave
          # every installed copy getting a 404 on every check. The version in
          # the tag is what says this is a beta.
          gh release create $tag (Get-ChildItem dist-release | ForEach-Object { $_.FullName }) `
            --repo VibeSSH/vibessh-releases `
            --title "VibeSSH $tag" `
            --notes "Installer and update manifest for $tag. Source: private repository."
