# Reference deployment for self-hosting the VibeSSH backend - not exercised
# in this dev environment (no Docker available here; the backend was built
# and tested this session against a locally installed Postgres instead, see
# .env.example). Structurally standard, but treat the first real run as the
# actual verification, the same as any other untested-here config.
# Without this the project is named after the directory it sits in, which is
# `backend` - so the containers, network and data volume all end up called
# `backend-*` on a host that may well run other things.
name: vibessh

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibessh
      POSTGRES_USER: vibessh_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment or a .env file}
    volumes:
      - vibessh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibessh_app -d vibessh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # The repository root, two levels up - the crate is a workspace member
      # and the build needs the workspace Cargo.toml and Cargo.lock. This was
      # `..` while the crate lived at `backend/`; after the move to
      # `apps/backend/` that pointed at `apps/`, which has neither.
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vibessh_app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/vibessh
      VIBESSH_BACKEND_BIND: 0.0.0.0:8787
      # The deployment puts a tunnel in front, so every request arrives from
      # the proxy and the caller's real address is in a header. Only set this
      # where something in front actually overwrites that header - a service
      # reachable directly would let an attacker set it per request and walk
      # straight past the per-address rate limit.
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-}
      # Missing here until the first real deployment, which is exactly the
      # kind of thing the note at the top of this file warns about: the
      # process refuses to start without it (main.rs), so the container
      # restarted in a loop with the reason only visible in its logs.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET - e.g. `openssl rand -base64 48`}
      # Optional: unset means this deployment simply reports that it has no
      # included model, and users bring their own key. Empty defaults so that
      # a missing value is not an error.
      AI_UPSTREAM_BASE_URL: ${AI_UPSTREAM_BASE_URL:-}
      AI_UPSTREAM_API_KEY: ${AI_UPSTREAM_API_KEY:-}
      AI_UPSTREAM_MODEL: ${AI_UPSTREAM_MODEL:-}
      AI_DAILY_QUESTION_LIMIT: ${AI_DAILY_QUESTION_LIMIT:-}
    ports:
      # Loopback, not every interface. This service carries account passwords
      # and issues the tokens that stand in for them, so it has no business
      # being reachable over plain HTTP - put a TLS terminator in front of it
      # (Caddy, nginx, Traefik) and let that hold the certificate. Publishing
      # on `8787:8787` would also sidestep ufw, because Docker writes its own
      # forwarding rules ahead of it.
      - "127.0.0.1:8787:8787"

volumes:
  vibessh-postgres-data:
