# Reference deployment for self-hosting the VibeSSH backend - not exercised
# in this dev environment (no Docker available here; the backend was built
# and tested this session against a locally installed Postgres instead, see
# .env.example). Structurally standard, but treat the first real run as the
# actual verification, the same as any other untested-here config.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibessh
      POSTGRES_USER: vibessh_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment or a .env file}
    volumes:
      - vibessh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibessh_app -d vibessh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vibessh_app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/vibessh
      VIBESSH_BACKEND_BIND: 0.0.0.0:8787
    ports:
      - "8787:8787"

volumes:
  vibessh-postgres-data:
