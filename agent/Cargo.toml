[package]
name = "vibe-agent"
version.workspace = true
description = "VibeSSH Agent - lightweight daemon for realtime server management"
edition.workspace = true
license.workspace = true

[[bin]]
name = "vibe-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
env_logger = "0.11"
hostname = "0.4"
os_info = "3"
dirs = "5"
vibessh-protocol = { path = "../protocol" }
# axum covers both halves of Etap D's transport (HTTP request/response and
# WebSocket realtime) with one dependency instead of stitching two libraries
# together.
axum = { version = "0.7", features = ["ws"] }
sha2 = { workspace = true }
# `vibe-agent pair <code>` is a short-lived blocking CLI call to the
# already-running daemon's local control endpoint - not worth spinning up
# tokio for, so this stays a synchronous, minimal-dependency HTTP client
# rather than reqwest.
ureq = { version = "2", features = ["json"] }
# CPU/RAM/disk/load/uptime/network collection (Etap J). Hand-rolled /proc
# parsing for all of these would mean reimplementing what this crate
# already does correctly across kernel/cgroup/filesystem edge cases - the
# same reasoning as using axum instead of a bespoke HTTP layer.
sysinfo = "0.39"
# TLS for the public WebSocket endpoint (Etap K security review) - defeats
# passive eavesdropping on the pairing code / issued credential, which
# were plaintext before this. Self-signed (no CA infra for an arbitrary
# self-hosted VPS agent); see src/tls.rs for what this does and doesn't
# protect against.
rcgen = "0.13"
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Explicit (not just pulled in transitively by axum-server) so we can
# select+install the process-wide crypto backend ourselves - rustls 0.23
# refuses to guess when more than one is reachable. See tls.rs.
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
native-tls = "0.2"
